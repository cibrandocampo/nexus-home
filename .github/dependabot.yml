# Weekly dependency update PRs for the platform (platform/). Backend requirements are pip-compiled
# with hashes: when Dependabot bumps a requirements.in-pinned package, regenerate the lock files with
# `make lock` (in platform/) on that branch. Images used in several directories come in one PR (a
# group spans the directories), so a version never lands in production without dev and the
# end-to-end stack. A major Postgres bump needs the dump and restore in platform/docs/configuration.md
# on existing deployments.
version: 2
updates:
  - package-ecosystem: pip
    directory: /platform/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /platform/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # eslint-plugin-jsx-a11y 6.x accepts ESLint ≤ 9; drop this once it supports 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    groups:
      mantine:
        patterns: ["@mantine/*"]
      react:
        patterns: ["react", "react-dom", "react-router"]
      lint-and-test:
        patterns: ["eslint*", "@eslint/*", "prettier", "vitest", "@vitest/*", "@testing-library/*"]

  - package-ecosystem: npm
    directory: /platform/e2e
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: ["/platform", "/platform/dev", "/platform/e2e"]
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories: ["/platform", "/platform/dev", "/platform/e2e"]
    schedule:
      interval: weekly
    groups:
      services:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
