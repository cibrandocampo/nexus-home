name: Platform

# Lint, unit tests, end-to-end tests and the production image of platform/, all through Docker as on a
# laptop. Runs when platform/ or this workflow changes, and on platform releases (tag
# `platform-v<version>`; firmware releases such as `garage-v2.0.5` do not run it).
# The image is pushed to Docker Hub only when the repository has DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN secrets (and the DOCKER_IMAGE variable): `latest` from main, `<version>` and
# `stable` from a published platform release. Without them it is built (amd64) and not pushed.

# The simulator ports the garage firmware (garage.cpp, settings.cpp, json.h, config.h) and is held to
# its contract (README, http.cpp): a change to any of them must re-run the simulator's tests,
# hence those paths.
on:
  push:
    branches: [main]
    paths:
      - platform/**
      - .github/workflows/platform.yml
      - devices/garage-iot-controller/README.md
      - devices/garage-iot-controller/firmware/http.cpp
      - devices/garage-iot-controller/firmware/garage.cpp
      - devices/garage-iot-controller/firmware/garage.h
      - devices/garage-iot-controller/firmware/settings.cpp
      - devices/garage-iot-controller/firmware/json.h
      - devices/garage-iot-controller/firmware/config.h
  pull_request:
    branches: [main]
    paths:
      - platform/**
      - .github/workflows/platform.yml
      - devices/garage-iot-controller/README.md
      - devices/garage-iot-controller/firmware/http.cpp
      - devices/garage-iot-controller/firmware/garage.cpp
      - devices/garage-iot-controller/firmware/garage.h
      - devices/garage-iot-controller/firmware/settings.cpp
      - devices/garage-iot-controller/firmware/json.h
      - devices/garage-iot-controller/firmware/config.h
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only a newer push to the same PR cancels a running PR run; main and release runs are never
  # cancelled once started (GitHub may still drop a queued one when a newer run of the group queues).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEV: docker compose --env-file .env -f dev/docker-compose.yml

# Each job carries the same `if:`: on a release run it only runs for a platform release.
defaults:
  run:
    working-directory: platform

jobs:
  backend:
    name: Backend
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'platform-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare the environment
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build
        run: $DEV build backend

      - name: Lint and format
        run: $DEV run --rm --no-deps backend sh -c "ruff check . && ruff format --check ."

      - name: Tests with coverage
        # Starts db and Mailpit (healthy) first; the email integration test delivers to Mailpit.
        run: $DEV run --rm backend sh -c "coverage run -m pytest -q && coverage report"

      - name: Stop the stack
        if: always()
        run: $DEV down -v

  frontend:
    name: Frontend
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'platform-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare the environment
        run: |
          cp .env.example .env
          # The image's `node` user writes coverage into the bind-mounted checkout.
          chmod -R a+rwX frontend

      - name: Build
        run: $DEV build frontend

      - name: Lint, format and tests with coverage
        run: >-
          $DEV run --rm --no-deps frontend
          sh -c "npm run lint && npm run format:check && npm run test:coverage"

      - name: Production build
        run: $DEV run --rm --no-deps frontend npm run build

      - name: End-to-end specs format
        run: >-
          docker run --rm -e HOME=/tmp -e NPM_CONFIG_UPDATE_NOTIFIER=false
          -v "$PWD:/repo" -w /repo node:26-alpine
          npx -y prettier@3.10.1 --config frontend/.prettierrc.json --check
          'e2e/**/*.{js,json}' '!e2e/package-lock.json'

  simulator:
    name: Simulator
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'platform-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare the environment
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Lint, format and tests with coverage (contract included)
        run: make lint-simulator test-simulator

  audit:
    name: Dependency audit
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'platform-v')
    runs-on: ubuntu-latest
    # Advisory only: a new advisory must not block unrelated work; read the log.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Python (pip-audit)
        run: >-
          docker run --rm -v "$PWD/backend:/app:ro" -w /app python:3.14-slim
          sh -c "pip install -q --root-user-action=ignore pip-audit &&
          pip-audit --strict -r requirements.txt --require-hashes --disable-pip"

      - name: JavaScript (npm audit)
        run: >-
          docker run --rm -v "$PWD/frontend:/app:ro" -w /app node:26-alpine
          npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end
    needs: [backend, frontend, simulator]
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'platform-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Production database starts (docker-compose.yml, data on disk)
        # The suite runs its own compose file; this catches a Postgres bump that breaks the deploy's
        # volume (18 moved its data directory).
        run: |
          cp .env.example .env
          export DATA_PATH="$RUNNER_TEMP/data"
          docker compose up -d --wait db
          test -n "$(sudo ls "$DATA_PATH/postgres")"
          docker compose down

      - name: Run the suite (production image, Postgres, Mailpit, Playwright)
        run: make e2e

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: platform/e2e/artifacts/
          retention-days: 14

  image:
    name: Image
    needs: e2e
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'platform-v')
    runs-on: ubuntu-latest
    env:
      CAN_PUSH: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' && vars.DOCKER_IMAGE != '' }}
      PUSH_EVENT: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tags

      - name: Version
        id: version
        run: |
          # Platform tags only (firmware releases are garage-v…); the image version has no prefix.
          echo "value=$(git describe --tags --match 'platform-v*' --always | sed 's/^platform-v//')" >> "$GITHUB_OUTPUT"
          if [ "$CAN_PUSH" = "true" ] && [ "$PUSH_EVENT" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.version.outputs.push == 'true'

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: steps.version.outputs.push == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKER_IMAGE || 'nexus-home' }}
          # Without this the action adds `latest` to every release; `latest` is main only.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=match,pattern=platform-v(\d+\.\d+\.\d+.*),group=1,enable=${{ github.event_name == 'release' }}
            type=raw,value=stable,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=ref,event=pr

      - name: Build (and push when allowed)
        uses: docker/build-push-action@v7
        with:
          context: platform
          platforms: ${{ steps.version.outputs.push == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ steps.version.outputs.push == 'true' }}
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
