name: CI

# Garage firmware: host tests and build. Runs when the garage controller or this workflow changes.
# The platform has its own workflow (platform.yml).

on:
  pull_request:
    paths: [devices/garage-iot-controller/**, .github/workflows/ci.yml]
  push:
    branches: [main]
    paths: [devices/garage-iot-controller/**, .github/workflows/ci.yml]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  garage-firmware:
    name: Garage firmware (host tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devices/garage-iot-controller
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the UNO R4 core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno@1.6.0
      - name: Host tests and build
        run: tools/build.sh
