# Production: the published image and Postgres. Works as a Synology Container Manager project.
# Settings come from .env (copy .env.example); every variable is described in docs/configuration.md.
# For development use dev/docker-compose.yml (`make dev-up`).

name: ${PROJECT_NAME:-nexus}

services:
  app:
    image: ${DOCKER_IMAGE:?Set DOCKER_IMAGE in .env}:${APP_TAG:-stable}
    env_file: .env
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    # Nothing in the container is written to except /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_PATH:-./data}/postgres:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
