<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ app_name }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="480" cellpadding="0" cellspacing="0" style="width:100%;max-width:480px;background:#ffffff;border-radius:12px;">
<tr><td align="center" style="padding:32px 32px 24px;">
<img src="cid:logo" width="48" height="48" alt="{{ app_name }}" style="display:block;border:0;">
</td></tr>
<tr><td style="padding:0 32px 32px;font-size:16px;line-height:1.5;">
{% block content %}{% endblock %}
</td></tr>
</table>
<p style="font-size:12px;color:#6b7280;margin-top:16px;"><a href="{{ site_url }}" style="color:#6b7280;">{{ app_name }}</a></p>
</td></tr>
</table>
</body>
</html>
