# End-to-end stack: the production image (built from the root Dockerfile), a throwaway Postgres,
# Mailpit for the sign-in codes and the Playwright runner. Run with `make e2e`, which tears it all
# down afterwards. Nothing here is for deployment: the secrets are fixed test values.

name: ${PROJECT_NAME:-nexus}-e2e

x-admin: &admin
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: e2e-admin-password-1

services:
  db:
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.34
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Not called `app`: Chromium preloads HSTS for the whole .app top-level domain, so http://app
  # would always be forced to https.
  server:
    build:
      context: ..
      args:
        APP_VERSION: e2e
    environment:
      <<: *admin
      ENV: production
      APP_NAME: E2E App
      DATABASE_URL: postgresql+asyncpg://e2e:e2e@db:5432/e2e
      SECRET_KEY: e2e-only-secret-key-not-for-deployment-0123456789
      DEVICE_TOKEN_KEY: tvvrxZOGUWmbvodmRntVIw1lQGK5i34S3nmOK2zrv6U=
      COOKIE_SECURE: "false"
      SITE_URL: http://server:8000
      ALLOW_SELF_SIGNUP: "true"
      RATE_LIMIT_ENABLED: "false"
      EMAIL_FROM: E2E App <no-reply@example.com>
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      # Devices: the scan covers the simulators' fixed addresses; a fast poll keeps the specs short.
      SCAN_RANGES: 172.31.250.0/28
      SCAN_TIMEOUT_S: "1"
      POLL_INTERVAL_S: "1"
      LOG_READ_EVERY_S: "5"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Simulated garage boards (platform/simulator) for the device specs, at fixed addresses inside
  # SCAN_RANGES: one with a token, one new board without (the platform gives it one).
  sim-garage: &sim
    build: ../simulator
    environment:
      SIM_ID: garage-e2e001
      SIM_NAME: E2E Garage
      SIM_TOKEN: e2e-sim-token
      SIM_SPEED: "10"
    networks:
      default:
        ipv4_address: 172.31.250.10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/api/v1/info')"]
      interval: 2s
      timeout: 3s
      retries: 30

  sim-garage-new:
    <<: *sim
    environment:
      SIM_ID: garage-e2e002
      SIM_NAME: New Garage
      SIM_TOKEN: ""
      SIM_SPEED: "10"
    networks:
      default:
        ipv4_address: 172.31.250.11

  playwright:
    build:
      context: .
    environment:
      <<: *admin
      SIM_URL: http://sim-garage
      SIM_NEW_URL: http://sim-garage-new
      SIM_TOKEN: e2e-sim-token
      BASE_URL: http://server:8000
      MAILPIT_URL: http://mailpit:8025
      CI: ${CI:-}
      HOME: /tmp
    # Files written to the bind mount (the report) belong to the host user.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      # Report (artifacts/report) and failure traces (artifacts/test-results); `make e2e` creates it.
      - ./artifacts:/e2e/artifacts
    depends_on:
      server:
        condition: service_healthy
      sim-garage:
        condition: service_healthy
      sim-garage-new:
        condition: service_healthy

# A fixed subnet: the simulators get known addresses inside SCAN_RANGES (172.31.250.0/28); the
# other services take theirs from the upper half (ip_range), outside the scanned range.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          ip_range: 172.31.250.128/25
